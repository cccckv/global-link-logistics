<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#bg4)" />

  <text x="480" y="38" fill="#38bdf8" font-size="20" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">运单全景调度与散货批量装柜排箱操作指引</text>
  <text x="480" y="62" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">在运单看板批量勾选已入库散货 ➔ 一键指派目标集装箱 ➔ 自动流转为「已装柜 (LOADED)」</text>

  <!-- Left: Multi-select in Waybill List -->
  <g transform="translate(30, 85)" filter="url(#shadow4)">
    <rect width="420" height="305" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="40" rx="12" fill="#0f172a" />
    <text x="16" y="25" fill="#38bdf8" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">步骤 1：运单列表多选已入库散货</text>

    <!-- Table Header -->
    <rect x="15" y="52" width="390" height="28" rx="4" fill="#334155" />
    <text x="25" y="70" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">☑ 勾选</text>
    <text x="80" y="70" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">运单号</text>
    <text x="180" y="70" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">唛头</text>
    <text x="270" y="70" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">核算方数</text>
    <text x="350" y="70" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">状态</text>

    <!-- Row 1 Selected -->
    <rect x="15" y="86" width="390" height="36" rx="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1" />
    <rect x="25" y="96" width="16" height="16" rx="3" fill="#2563eb" />
    <text x="33" y="109" fill="#ffffff" font-size="11" text-anchor="middle">✓</text>
    <text x="80" y="109" fill="#93c5fd" font-size="11" font-family="monospace">WB26082001</text>
    <text x="180" y="109" fill="#ffffff" font-size="11" font-weight="bold">WH-ZZY-FLB</text>
    <text x="270" y="109" fill="#34d399" font-size="11" font-family="monospace">0.699 m³</text>
    <text x="350" y="109" fill="#60a5fa" font-size="10">已入库</text>

    <!-- Row 2 Selected -->
    <rect x="15" y="128" width="390" height="36" rx="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1" />
    <rect x="25" y="138" width="16" height="16" rx="3" fill="#2563eb" />
    <text x="33" y="151" fill="#ffffff" font-size="11" text-anchor="middle">✓</text>
    <text x="80" y="151" fill="#93c5fd" font-size="11" font-family="monospace">WB26082002</text>
    <text x="180" y="151" fill="#ffffff" font-size="11" font-weight="bold">WH-10115</text>
    <text x="270" y="151" fill="#34d399" font-size="11" font-family="monospace">1.250 m³</text>
    <text x="350" y="151" fill="#60a5fa" font-size="10">已入库</text>

    <!-- Row 3 Selected -->
    <rect x="15" y="170" width="390" height="36" rx="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1" />
    <rect x="25" y="180" width="16" height="16" rx="3" fill="#2563eb" />
    <text x="33" y="193" fill="#ffffff" font-size="11" text-anchor="middle">✓</text>
    <text x="80" y="193" fill="#93c5fd" font-size="11" font-family="monospace">WB26082003</text>
    <text x="180" y="193" fill="#ffffff" font-size="11" font-weight="bold">WH-李生</text>
    <text x="270" y="193" fill="#34d399" font-size="11" font-family="monospace">0.450 m³</text>
    <text x="350" y="193" fill="#60a5fa" font-size="10">已入库</text>

    <!-- Batch Trigger Button Mockup -->
    <rect x="15" y="225" width="390" height="55" rx="8" fill="#4f46e5" />
    <text x="210" y="250" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">📦 批量排柜 (已选 3 票散货)</text>
    <text x="210" y="268" fill="#c7d2fe" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">勾选后顶部自动唤出批量装柜操作入口</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(460, 220)">
    <path d="M 0 0 L 30 0" stroke="#818cf8" stroke-width="3" stroke-dasharray="4,3" />
    <polygon points="30,-6 40,0 30,6" fill="#818cf8" />
  </g>

  <!-- Right: Modal Execution & Container Result -->
  <g transform="translate(510, 85)" filter="url(#shadow4)">
    <rect width="420" height="305" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="40" rx="12" fill="#312e81" />
    <text x="16" y="25" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">步骤 2：弹窗指派集装箱与装柜流转</text>

    <!-- Modal Form Mockup -->
    <text x="20" y="68" fill="#c7d2fe" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">选择目标集装箱 (ContainerMaster):</text>
    <rect x="20" y="78" width="380" height="34" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="32" y="100" fill="#ffffff" font-size="12" font-family="monospace">MILU6019768 (广62柜 · 广州南沙 ➔ 马尼拉南港)</text>

    <text x="20" y="132" fill="#c7d2fe" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">装柜日期:</text>
    <rect x="20" y="142" width="380" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="32" y="164" fill="#94a3b8" font-size="12" font-family="monospace">2026-08-20</text>

    <!-- Result Banner -->
    <rect x="20" y="190" width="380" height="95" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <text x="32" y="213" fill="#34d399" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">✓ 批量装柜流转结果：</text>
    <text x="32" y="235" fill="#a7f3d0" font-size="11" font-family="system-ui, sans-serif">• 3 票散货状态一键流转为【已装柜 (LOADED)】</text>
    <text x="32" y="255" fill="#a7f3d0" font-size="11" font-family="system-ui, sans-serif">• 集装箱名下已装载散货方数自动累加至 <strong fill="#ffffff">2.399 m³</strong></text>
    <text x="32" y="275" fill="#fef08a" font-size="10" font-family="system-ui, sans-serif">💡 集装箱跟踪页面可直接穿透查看这 3 票运单明细</text>
  </g>
</svg>
