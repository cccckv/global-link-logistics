<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="960" height="400" rx="16" fill="url(#bg7)" />

  <text x="480" y="38" fill="#38bdf8" font-size="20" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">海外收件人随时在途修改与一键复制派件单指引</text>
  <text x="480" y="62" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">紧凑摘要卡片 ➔ 随时在途纠偏修改 ➔ 一键生成标准派件指令微信/WhatsApp发送海外司机</text>

  <!-- Left: In-transit Modify Consignee -->
  <g transform="translate(30, 85)" filter="url(#shadow7)">
    <rect width="430" height="285" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="430" height="40" rx="12" fill="#1e3a8a" />
    <text x="16" y="25" fill="#ffffff" font-size="13" font-weight="bold">📍 海外收件人档案（支持全流程随时修改）</text>

    <text x="16" y="65" fill="#93c5fd" font-size="11">• 业务痛点：开船或在途航行中，客户通知更换收货人或新地址</text>
    <text x="16" y="85" fill="#93c5fd" font-size="11">• 解决方式：随时在运单详情卡片点击【修改海外收件人】</text>

    <!-- Address Card Mockup -->
    <rect x="16" y="100" width="398" height="115" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="28" y="125" fill="#ffffff" font-size="12" font-weight="bold">海外联系人: <tspan fill="#38bdf8">Alex Johnson</tspan></text>
    <text x="28" y="148" fill="#ffffff" font-size="12">海外电话/WhatsApp: <tspan fill="#34d399" font-family="monospace">+63 917 123 4567</tspan></text>
    <text x="28" y="171" fill="#ffffff" font-size="12">海外收件公司: <tspan fill="#cbd5e1">Manila Trading Inc.</tspan></text>
    <text x="28" y="194" fill="#ffffff" font-size="12">详细派送地址: <tspan fill="#fef08a">Unit 802, BGC Tower, Taguig City, Metro Manila</tspan></text>

    <text x="16" y="235" fill="#34d399" font-size="11">✓ 修改保存即刻生效，不打断阶段流转</text>
    <text x="16" y="255" fill="#34d399" font-size="11">✓ 阶段 5 清关放行前弹窗自动再次高亮核对最新地址</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(470, 215)">
    <path d="M 0 0 L 25 0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,3" />
    <polygon points="25,-6 35,0 25,6" fill="#38bdf8" />
  </g>

  <!-- Right: One-click Copy Dispatch Instruction -->
  <g transform="translate(510, 85)" filter="url(#shadow7)">
    <rect width="420" height="285" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="40" rx="12" fill="#065f46" />
    <text x="16" y="25" fill="#ffffff" font-size="13" font-weight="bold">📋 一键复制标准派件指令 (发海外司机)</text>

    <text x="16" y="65" fill="#a7f3d0" font-size="11">点击卡片【复制派件指令】，系统自动生成格式化指令：</text>

    <!-- Clipboard Text Mockup -->
    <rect x="16" y="80" width="388" height="150" rx="8" fill="#0f172a" stroke="#059669" />
    <text x="26" y="102" fill="#34d399" font-size="11" font-family="monospace">【派件单】运单号: WB202608200001 | 唛头: WH-ZZY-FLB</text>
    <text x="26" y="122" fill="#cbd5e1" font-size="11" font-family="monospace">始发仓: 广州白云集拼总仓</text>
    <text x="26" y="142" fill="#cbd5e1" font-size="11" font-family="monospace">目的港: 菲律宾 (马尼拉南港)</text>
    <text x="26" y="162" fill="#cbd5e1" font-size="11" font-family="monospace">海外收件人: Alex Johnson (+63 917 123 4567)</text>
    <text x="26" y="182" fill="#fef08a" font-size="11" font-family="monospace">派送地址: Unit 802, BGC Tower, Taguig City</text>
    <text x="26" y="202" fill="#93c5fd" font-size="11" font-family="monospace">货物概况: 共 10 件 / 计费体积 0.699 m³ / 万海专线</text>

    <!-- Copy Button Action -->
    <rect x="16" y="240" width="388" height="32" rx="6" fill="#10b981" />
    <text x="210" y="261" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">✓ 已复制到剪贴板，直接粘贴发送 WhatsApp / 微信</text>
  </g>
</svg>
